name: Quality

# Catch correctness AND answer-quality regressions on every push/PR that touches the
# copilot logic or prompts — the same gate discipline code already has, extended to
# eval quality. Prompt changes (lib/copilot/modes.ts) are the highest-risk edits and
# were previously ungated; this makes a quality regression fail like a type error does.
on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'app/**'
      - 'components/**'
      - 'evals/**'
      - 'qa/aptitude/**'
      - 'scripts/*verify_deployment.py'
      - 'scripts/*brand-desktop.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'proxy.ts'
      - 'next.config.ts'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'app/**'
      - 'components/**'
      - 'evals/**'
      - 'qa/aptitude/**'
      - 'scripts/*verify_deployment.py'
      - 'scripts/*brand-desktop.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'proxy.ts'
      - 'next.config.ts'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1. Types + unit suite — the existing code gate.
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm exec vitest run --maxWorkers=4
      - name: Release checker tests
        run: python3 -B -m unittest scripts/test_verify_deployment.py
      - name: Desktop branding configuration tests
        run: node --test scripts/test-brand-desktop.mjs
      - name: Lint
        run: pnpm run lint
      - name: Production build
        run: pnpm run build

      # 2. Question-detection eval — PURE LOGIC, no API key. Hard regression gate:
      #    the eval itself fails if F1 drops below its floor, failing the job.
      - name: Detection eval (F1 gate)
        run: pnpm run eval:detection

      # 3. Key-dependent evals (coding pass@1, behavioral voice). These SELF-SKIP
      #    when no provider key is present, so they never break CI on a fork/PR
      #    without secrets — but WHEN secrets exist (push to main/master) they run and a
      #    quality regression fails the job. Non-blocking on absence, blocking on
      #    presence-and-fail.
      - name: Answer-quality evals (run if keys present)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pnpm run eval:coding
          pnpm run eval:voice
          pnpm run eval:live

  aptitude-browser:
    name: Aptitude browser workflow
    # Match the pinned Playwright runtime; ubuntu-latest can advance independently.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Offline aptitude evaluation
        run: pnpm run eval:aptitude
      - name: Build actual application
        run: pnpm run build
      - name: Install pinned browser tooling
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify capture, question changes, recovery and responsive UI
        run: |
          mkdir -p qa-results/aptitude
          pnpm start --hostname 127.0.0.1 --port 3000 > qa-results/aptitude/server.log 2>&1 &
          APTITUDE_SERVER_PID=$!
          trap 'kill "$APTITUDE_SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/tools >/dev/null && break; sleep 1; done
          pnpm run test:aptitude:browser
      - name: Verify browser-local session recovery with a development owner
        # No secrets are supplied to this job. The existing bypass is development-only;
        # the harness verifies invalid requests fail and intercepts all model requests.
        run: |
          PREVIEW_NO_AUTH=1 pnpm dev --hostname 127.0.0.1 --port 3001 > qa-results/aptitude/archive-server.log 2>&1 &
          APTITUDE_ARCHIVE_SERVER_PID=$!
          trap 'kill "$APTITUDE_ARCHIVE_SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3001/tools >/dev/null && break; sleep 1; done
          APTITUDE_QA_URL=http://127.0.0.1:3001 APTITUDE_QA_PREVIEW_OWNER=1 pnpm run test:aptitude:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aptitude-browser-${{ github.sha }}
          path: qa-results/aptitude/
          retention-days: 14
